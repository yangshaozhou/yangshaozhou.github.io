baseURL = "https://yangshaozhou.github.io/"
locale = "zh-cn"
defaultContentLanguage = "zh"
hasCJKLanguage = true
title = "星轨路迹"
theme = "hugo-theme-stack"
enableRobotsTXT = true

[pagination]
  pagerSize = 10

[menus]
  [[menus.main]]
    name = "首页"
    pageRef = "/"
    weight = 10
    params = { icon = "home" }

  [[menus.main]]
    name = "文章归档"
    pageRef = "/archives/"
    weight = 20
    params = { icon = "archives" }

  [[menus.main]]
    name = "照片"
    pageRef = "/photos/"
    weight = 30
    params = { icon = "photo" }

  [[menus.main]]
    name = "箴言"
    pageRef = "/quotes/"
    weight = 40
    params = { icon = "quote" }

  [[menus.main]]
    name = "关于我"
    pageRef = "/about/"
    weight = 50
    params = { icon = "user" }

[params]
  env = "production"
  description = "星轨路迹，记录技术、思考与生活。"
  author = "杨少洲"
  mainSections = ["posts"]
  rssFullContent = true

  [params.footer]
    since = 2026

  [params.sidebar]
    emoji = "✦"
    subtitle = "在星轨之间，记录脚下的路迹。"
    compact = false

  [params.article]
    toc = true
    readingTime = true
    headingAnchor = false

  [params.widgets]
    homepage = [
      { type = "archives", params = { limit = 5 } },
      { type = "categories", params = { limit = 10 } },
      { type = "tag-cloud", params = { limit = 10 } }
    ]
    page = [
      { type = "archives", params = { limit = 5 } },
      { type = "categories", params = { limit = 10 } },
      { type = "tag-cloud", params = { limit = 10 } }
    ]

  [params.colorScheme]
    toggle = true
    default = "auto"

  [params.comments]
    enabled = false

[[menus.social]]
  identifier = "github"
  name = "GitHub"
  url = "https://github.com/yangshaozhou"
  [menus.social.params]
    icon = "brand-github"

[caches]
  [caches.images]
    dir = ":cacheDir/images"
