baseURL = "https://yangshaozhou.github.io/"
locale = "zh-cn"
defaultContentLanguage = "zh-cn"
title = "杨少洲的博客"
theme = "PaperMod"
enableRobotsTXT = true

[pagination]
  pagerSize = 10

[menus]
  [[menus.main]]
    name = "首页"
    pageRef = "/"
    weight = 10

  [[menus.main]]
    name = "文章归档"
    pageRef = "/archives/"
    weight = 20

  [[menus.main]]
    name = "照片"
    pageRef = "/photos/"
    weight = 30

  [[menus.main]]
    name = "箴言"
    pageRef = "/quotes/"
    weight = 40

  [[menus.main]]
    name = "关于我"
    pageRef = "/about/"
    weight = 50

[params]
  env = "production"
  description = "杨少洲的个人博客，记录技术、思考与生活。"
  author = "杨少洲"
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowCodeCopyButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowToc = true
  ShowShareButtons = true

[params.homeInfoParams]
  Title = "你好，我是杨少洲 👋"
  Content = "这里记录我的技术实践、学习笔记与生活思考。"

[[params.socialIcons]]
  name = "github"
  url = "https://github.com/yangshaozhou"

[caches]
  [caches.images]
    dir = ":cacheDir/images"
